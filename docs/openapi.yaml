openapi: 3.0.3

info:
  title: Mini Microservices Store API
  description: API documentation for the Mini Microservices Store
  version: 1.0.0

servers:
  - url: http://localhost:4000
    description: API Gateway

tags:
  - name: Authentication
    description: User registration and authentication
  - name: Products
    description: Product management and product discovery
  - name: Categories
    description: Product category management
  - name: Orders
    description: Customer order management

paths:

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Required fields are missing
        "409":
          description: Email already registered
        "500":
          description: Internal server error

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticates a user and returns a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Email and password are required
        "401":
          description: Invalid credentials or inactive account
        "500":
          description: Internal server error

  /api/catalog/products:
    get:
      tags:
        - Products
      summary: Get products
      description: Get active products with search, filtering and pagination.
      parameters:
        - name: search
          in: query
          description: Search product name or description
          required: false
          schema:
            type: string

        - name: category
          in: query
          description: Category ID
          required: false
          schema:
            type: string

        - name: minPrice
          in: query
          description: Minimum price
          required: false
          schema:
            type: number
            minimum: 0

        - name: maxPrice
          in: query
          description: Maximum price
          required: false
          schema:
            type: number
            minimum: 0

        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          description: Number of products per page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10

      responses:
        "200":
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "500":
          description: Failed to retrieve products

    post:
      tags:
        - Products
      summary: Create a product
      description: Creates a product and optionally uploads up to 10 images.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "201":
          description: Product created successfully
        "400":
          description: Invalid product data
        "500":
          description: Failed to create product

  /api/catalog/products/{id}:
    get:
      tags:
        - Products
      summary: Get a product
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Product not found
        "500":
          description: Failed to retrieve product

    put:
      tags:
        - Products
      summary: Update a product
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
      responses:
        "200":
          description: Product updated successfully
        "404":
          description: Product not found
        "500":
          description: Failed to update product

    delete:
      tags:
        - Products
      summary: Delete a product
      description: Soft deletes the product by setting isActive to false.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Product deleted successfully
        "404":
          description: Product not found
        "500":
          description: Failed to delete product

  /api/catalog/categories:
    get:
      tags:
        - Categories
      summary: Get categories
      responses:
        "200":
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
        "500":
          description: Failed to retrieve categories

    post:
      tags:
        - Categories
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
      responses:
        "201":
          description: Category created successfully
        "409":
          description: Category already exists
        "500":
          description: Failed to create category

  /api/catalog/categories/{id}:
    get:
      tags:
        - Categories
      summary: Get a category
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "404":
          description: Category not found
        "500":
          description: Failed to retrieve category

    put:
      tags:
        - Categories
      summary: Update a category
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdateRequest"
      responses:
        "200":
          description: Category updated successfully
        "404":
          description: Category not found
        "409":
          description: Category already exists
        "500":
          description: Failed to update category

    delete:
      tags:
        - Categories
      summary: Delete a category
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Category deleted successfully
        "404":
          description: Category not found
        "500":
          description: Failed to delete category

  /api/orders/:
    post:
      tags:
        - Orders
      summary: Create an order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Invalid order data
        "401":
          description: Authentication required
        "500":
          description: Failed to create order

    get:
      tags:
        - Orders
      summary: Get my orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "401":
          description: Authentication required
        "500":
          description: Failed to retrieve orders

  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Get one order
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          description: Authentication required
        "404":
          description: Order not found
        "500":
          description: Failed to retrieve order

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    Id:
      name: id
      in: path
      required: true
      description: MongoDB document ID
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"

  schemas:

    RegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          example: Dolores
        lastName:
          type: string
          example: Onwugbufor
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          format: password
          example: Password123!

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User registered successfully
        data:
          $ref: "#/components/schemas/User"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login successful
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            token:
              type: string
              description: JWT access token

    User:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - CUSTOMER
            - ADMIN
        isActive:
          type: boolean

    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: integer
        category:
          $ref: "#/components/schemas/Category"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductImage:
      type: object
      properties:
        url:
          type: string
          format: uri
        publicId:
          type: string

    ProductCreateRequest:
      type: object
      required:
        - name
        - description
        - price
        - stock
        - category
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          minLength: 5
          maxLength: 1000
        price:
          type: number
          minimum: 0
        stock:
          type: integer
          minimum: 0
        category:
          type: string
        isActive:
          type: boolean
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: binary

    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
        stock:
          type: integer
          minimum: 0
        category:
          type: string
        isActive:
          type: boolean
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: binary

    ProductResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/Product"

    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    Category:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
        isActive:
          type: boolean

    CategoryUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean

    CategoryResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/Category"

    CategoryListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CreateOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: string
              quantity:
                type: integer
                minimum: 1

    Order:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              quantity:
                type: integer
        subtotal:
          type: number
        totalAmount:
          type: number
        status:
          type: string
          example: PENDING
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/Order"

    OrderListResponse:
      type: object
      properties:
        success:
          type: boolean
        count:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"